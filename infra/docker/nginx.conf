server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 10m;
    location /api/ {
        proxy_set_header Host $http_host;
        proxy_pass http://127.0.0.1:3000;
    }
    location /assets/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# API entry point for local clients and the independent package verifier.
server {
    listen 8081;
    server_name _;
    client_max_body_size 10m;
    location /api/ {
        proxy_set_header Host $http_host;
        proxy_pass http://127.0.0.1:3000;
    }
    location / {
        return 404;
    }
}
