name: ${BROTAR_COMPOSE_PROJECT:-brotar-provisional-v2}
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: brotar_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecuta el instalador de la base provisional v2}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15433}:5432"
    volumes:
      - brotar_pgdata_v2:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brotar_db"]
      interval: 3s
      timeout: 3s
      retries: 25
    restart: "no"
volumes:
  brotar_pgdata_v2:
