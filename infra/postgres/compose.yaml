name: brotar-local
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: brotar_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en infra/postgres/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - brotar_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brotar_db"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: "no"
volumes:
  brotar_pgdata:
